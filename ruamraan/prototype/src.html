<title>รวมร้าน หลังร้าน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*__ELEMENT_CSS__*/</style>
<style>
/* Layout: reference back-office system, values measured from the reference product — 240px #F3F3F3 rail, no top bar, flat white list pages (filters → 6px band → link toolbar → table → pager pinned to bottom). Single light look by design. */
:root{
  --pri:#0094FF; --pri-bg:#ECF5FF; --pri-bd:#C6E2FF; --link2:#2979FF; --link3:#528FFF;
  --tx:#333333; --tx-strong:#101010; --tx-table:#444444; --label:#999999; --remark:#A3A3A3; --regular:#606266; --ph:#A8ABB2;
  --bd:#DCDFE6; --row-bd:#F2F0F0; --strip-bd:#F3F6FE; --band:#F3F3F3; --grey-page:#EEEEEE; --head-bg:#FCFCFC; --tbl-line:#EBEEF5;
  --red:#F02020; --qty:#E82050; --warn:#FF5829;
  --s-pay:#1909EA; --s-ship:#FF8A00; --s-print:#00A8A0; --s-pickup:#0094FF; --s-sent:#13A35B; --s-cancel:#999999;
  --font:"Helvetica Neue","San Francisco",PingFang,Arial,"Microsoft YaHei",Thonburi,"Leelawadee UI",Tahoma,sans-serif;
  --el-color-primary:#0094FF; --el-color-primary-light-3:#4DB4FF; --el-color-primary-light-5:#80CAFF; --el-color-primary-light-7:#B3DFFF; --el-color-primary-light-8:#C6E2FF; --el-color-primary-light-9:#ECF5FF; --el-color-primary-dark-2:#0076CC;
  --el-font-family:var(--font); --el-font-size-base:14px; --el-text-color-primary:#303133; --el-text-color-regular:#606266; --el-border-color:#DCDFE6; --el-border-radius-base:4px;
  --el-table-header-bg-color:#FCFCFC; --el-table-header-text-color:#444444; --el-table-text-color:#444444; --el-table-border-color:#EBEEF5;
}
html,body{height:100%}
body{background:#fff;color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.43}
*{box-sizing:border-box}
#app{height:100%}
button{font-family:inherit}
.b{font-weight:700}.c-label{color:var(--label)}.c-reg{color:var(--regular)}.c-red{color:var(--red)}.c-pri{color:var(--pri)}.f12{font-size:12px}.f13{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}

/* ===== shell ===== */
.shell{height:100%;display:flex}
.rail{width:240px;flex:none;background:var(--band);display:flex;flex-direction:column;overflow:auto}
.rail-top{height:118px;flex:none;padding:18px 14px 0}
.logo{display:flex;align-items:center;gap:8px}
.logo i{width:42px;height:42px;border-radius:50% 50% 50% 8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:20px}
.logo b{font-size:22px;color:var(--pri);letter-spacing:.5px}.logo b span{font-weight:400}
.who{display:flex;align-items:center;margin:10px 0 0 48px;color:#666;cursor:pointer;font-size:14px}
.who .el-icon{color:#CCC;margin-left:4px}
.nav{display:flex;flex-direction:column}
.nb{height:40px;display:flex;align-items:center;padding:0 10px;color:#000;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:14px}
.nb .ico{width:40px;height:32px;display:grid;place-items:center;flex:none;font-size:16px}
.nb:hover{color:var(--pri)}
.nb.on{background:var(--pri);color:#fff}
.nb .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:9px;font-size:11px;line-height:16px;padding:0 6px}
.nb.on .cnt{background:#fff;color:var(--pri)}
.nb .car{margin-left:auto;font-size:12px;color:#999;transition:transform .15s}
.nb.open .car{transform:rotate(180deg)}
.nb.child{padding-left:50px}
.rail-foot{margin-top:auto;padding:16px 20px;color:var(--pri);display:flex;align-items:center;gap:6px;cursor:pointer}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.mob-bar{display:none;height:44px;align-items:center;gap:8px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--tbl-line);flex:none}
.view{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}

/* ===== list page ===== */
.filters{padding:10px 10px 5px;border-bottom:6px solid var(--band)}
.frow{display:flex;align-items:flex-start;min-height:28px;margin-bottom:2px}
.frow.in{min-height:32px}
.flab{width:130px;flex:none;text-align:right;color:var(--label);padding:7px 12px 0 0;line-height:14px}
.frow.in .flab{padding-top:9px}
.fct{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:0 10px}
.ob{height:24px;padding:5px 11px;border:0;border-radius:3px;background:none;color:#000;font-size:14px;line-height:14px;cursor:pointer;margin:2px 0;white-space:nowrap}
.ob:hover{color:var(--pri)}
.ob.on{background:var(--pri-bg);color:var(--pri)}
.ob em{font-style:normal;color:var(--red)}
.seg.el-radio-group .el-radio-button__inner{font-weight:400;color:var(--regular)}
.seg.el-radio-group .el-radio-button__original-radio:checked+.el-radio-button__inner{background:var(--pri-bg);color:var(--pri);border-color:var(--pri-bd);box-shadow:-1px 0 0 0 var(--pri-bd)}
.btn-search.el-button{background:var(--pri);border-color:var(--pri);color:#fff}
.btn-search-l.el-button{background:#E6F4FF;border-color:#E6F4FF;color:var(--pri)}
.btn-reset.el-button{background:#EEE;border-color:#EEE;color:var(--regular)}
.btn-reset.el-button:hover{background:#E4E4E4;border-color:#E4E4E4;color:var(--regular)}
.save-flt{font-size:12px;color:var(--pri);display:inline-flex;align-items:center;gap:3px;cursor:pointer;background:none;border:0}
.toolbar{min-height:44px;padding:6px 6px 6px 10px;display:flex;align-items:center;gap:4px 18px;flex-wrap:wrap}
.tb{display:inline-flex;align-items:center;gap:4px;color:var(--pri);background:none;border:0;cursor:pointer;font-size:14px;padding:4px 0;white-space:nowrap}
.tb:hover{opacity:.8}
.tb.dis{color:var(--label);cursor:not-allowed}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--regular)}
.tb-r .el-icon{color:var(--pri);cursor:pointer;font-size:16px}
.tbl{flex:1;min-height:0;overflow:auto}
.pager{flex:none;border-top:1px solid var(--tbl-line);height:42px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 10px;color:var(--regular);background:#fff}
.empty{padding:70px 0;text-align:center;color:#C0C4CC}
.empty .el-icon{font-size:56px;color:#C9CDD4}
.empty p{margin:8px 0 0;color:#A8ABB2}
.lk{color:var(--pri);background:none;border:0;padding:0;cursor:pointer;font-size:inherit}
.lk+.lk{margin-left:16px}

/* standard table tweaks (measured) */
.el-table th.el-table__cell{font-weight:400;height:40px;padding:8px 0}
.el-table th.el-table__cell:not(:last-child)>.cell{border-right:1px solid var(--bd)}
.el-table td.el-table__cell{border-bottom-color:transparent;padding:8px 0;height:53px}
.el-table .cell{padding:0 10px}
.el-table__inner-wrapper::before{background:transparent}
.pic{width:32px;height:32px;border-radius:3px;background:#EAF5FF;color:var(--pri);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.pic.l{width:40px;height:40px}
.ibtn{color:var(--pri);cursor:pointer;font-size:15px;margin-right:12px;vertical-align:middle}

/* order table (measured) */
.otbl{min-width:1160px}
.ocols{display:grid;grid-template-columns:minmax(300px,2.2fr) 105px 135px 125px 120px minmax(160px,1.3fr) 130px}
.ohead{position:sticky;top:0;z-index:2;height:36px;background:var(--head-bg);color:var(--tx-strong);border-bottom:1px solid var(--tbl-line);display:flex}
.ohead .chk{width:35px;padding:0 10px 0 18px;display:flex;align-items:center;flex:none}
.ohead .ocols{flex:1}
.ohead .ocols>div{padding:0 10px;display:flex;align-items:center;height:36px;position:relative}
.ohead .ocols>div:not(:last-child)::after{content:"";position:absolute;right:0;top:9px;height:18px;width:1px;background:var(--bd)}
.ord{display:flex;border:1px solid var(--row-bd);border-top:0;font-size:12px;color:var(--tx-strong);background:#fff}
.ord .bar{width:3px;flex:none}
.ord .rt{flex:1;min-width:0}
.ostrip{height:32px;border-bottom:1px solid var(--strip-bd);display:flex;align-items:center;padding-right:16px}
.ostrip .chk{width:35px;padding:0 10px 0 15px;display:flex;align-items:center;flex:none}
.ostat{display:inline-flex;align-items:center;margin:0 10px 0 5px;white-space:nowrap}
.ostat .ring{width:8px;height:8px;border-radius:50%;margin-right:6px;position:relative}
.ostat .ring::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:currentColor;opacity:.12}
.otime{font-weight:700;font-size:13px;margin-right:18px;white-space:nowrap}
.oid,.obuyer{color:var(--link2);display:inline-flex;align-items:center;gap:4px;cursor:pointer;margin-right:16px;white-space:nowrap}
.oshop{color:var(--pri);font-weight:700;display:inline-flex;align-items:center;gap:4px;margin:0 16px 0 4px;white-space:nowrap}
.oop{color:var(--regular);white-space:nowrap}
.oacts{margin-left:auto;color:var(--link3);font-size:14px;white-space:nowrap}
.oacts button{color:var(--link3);background:none;border:0;cursor:pointer;font-size:14px;padding:0}
.obody{display:flex}
.obody .sp{width:35px;flex:none}
.obody .ocols{flex:1}
.obody .ocols>div{padding:10px;min-width:0;line-height:22px}
.oitem{display:flex;gap:8px}
.oitem .nm{display:flex;gap:10px}
.oitem .qty{color:var(--qty)}
.sku{font-size:13px;font-weight:600;margin-right:8px}
.chn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chn b{width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:9px;font-weight:700}
.fb b{background:#1877F2}.tt b{background:#111}.sp b{background:#EE4D2D}.lz b{background:#0F146D}.ln b{background:#06C755}

/* settings */
.grey{background:var(--grey-page);flex:1;padding:10px}
.panel{width:740px;max-width:100%;background:#fff;border-radius:3px;padding:0 15px;margin-bottom:10px}
.setr{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;padding:16px 0;border-bottom:1px solid #E8E8E8}
.setr:last-child{border-bottom:0}
.setr .t{color:var(--tx)}
.setr .rm{color:var(--remark);margin-top:8px;line-height:18px}
.setr .ctl{flex:none}
.sett{padding:16px 0 12px;border-bottom:1px solid #E8E8E8;color:var(--tx)}
.req{color:var(--red);margin-right:2px}
.authrow{display:flex;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid var(--tbl-line)}
.authrow .lg{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}

/* report */
.ptitle{padding:10px;border-bottom:1px solid var(--bd);margin-bottom:15px;color:#000}
.cards{display:flex;gap:10px;flex-wrap:wrap;padding:0 10px 20px}
.kcard{flex:1 1 140px;max-width:180px;height:110px;border-radius:6px;background:#F7F8FA;position:relative;padding:54px 12px 0 14px}
.kcard .ci{position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px}
.kcard .k{color:#A0A4AB;font-size:14px;line-height:18px;position:absolute;left:52px;top:20px;right:8px}
.kcard .v{color:#303133;font-size:20px;font-weight:700}
.solid.el-radio-group .el-radio-button__inner{font-weight:400}

/* chat */
.chat{flex:1;display:flex;min-height:0}
.clist{width:250px;flex:none;border-right:1px solid var(--tbl-line);display:flex;flex-direction:column;min-height:0}
.cflt{padding:8px 10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--tbl-line)}
.cflt .lnks{display:flex;gap:16px;color:var(--label);font-size:13px}
.cflt .lnks span{cursor:pointer}
.citem{display:flex;gap:8px;padding:10px;cursor:pointer;border-bottom:1px solid #F5F5F5}
.citem.on{background:#EAF5FF}
.citem .nm{color:#043450;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .lm{color:#8C9EA8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .tm{color:#8C9EA8;font-size:12px}
.citem .dot{width:7px;height:7px;border-radius:50%;background:var(--red)}
.ava{width:34px;height:34px;border-radius:50%;background:#DDE6EE;color:#3B4A57;display:grid;place-items:center;font-weight:700;flex:none}
.cview{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--grey-page)}
.chead{height:44px;flex:none;background:#fff;border-bottom:1px solid var(--tbl-line);display:flex;align-items:center;gap:10px;padding:0 16px}
.msgs{flex:1;overflow:auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:14px}
.mrow{display:flex;flex-direction:column;align-items:flex-start;max-width:70%}
.mrow.me{align-self:flex-end;align-items:flex-end}
.mrow .tm{font-size:12px;color:#666;margin-bottom:5px}
.mbox{background:#fff;padding:10px 16px;border-radius:4px;color:#333;overflow-wrap:anywhere}
.mrow.me .mbox{background:#D6ECFF}
.sys{background:#fff;padding:10px 24px;max-width:440px}
.compose{background:#fff;border-top:1px solid var(--tbl-line);padding:8px 12px}
.compose .tools{display:flex;gap:16px;margin-bottom:6px}
.cinfo{width:280px;flex:none;border-left:1px solid var(--tbl-line);background:#fff;overflow:auto}
.cinfo .sec{padding:12px 14px;border-bottom:1px solid var(--tbl-line)}

/* live */
.live{flex:1;display:flex;min-height:0}
.lvideo{width:300px;flex:none;border-right:1px solid var(--tbl-line);padding:10px;display:flex;flex-direction:column;gap:10px}
.screen{aspect-ratio:9/14;max-width:100%;background:#1E1E1E;color:#bbb;display:grid;place-items:center;text-align:center;position:relative;border-radius:2px}
.screen .onair{position:absolute;left:8px;top:8px;background:#F02020;color:#fff;font-size:12px;padding:0 6px;border-radius:2px}
.lstat{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--tbl-line)}
.lstat div{padding:8px;text-align:center}.lstat div+div{border-left:1px solid var(--tbl-line)}
.lstat b{display:block;font-size:18px}
.lfeed{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--tbl-line)}
.lhead{height:40px;flex:none;background:var(--head-bg);border-bottom:1px solid var(--tbl-line);display:flex;align-items:center;padding:0 12px;gap:10px}
.feed{flex:1;overflow:auto}
.cm{padding:8px 12px;border-bottom:1px solid #F5F5F5}
.cm .who{color:#043450;margin-right:6px}
.cm .res{font-size:12px;margin-top:2px}
.cm.hit{background:#F3FAF5}.cm.hit .res{color:var(--s-sent)}
.cm.over{background:#FFF5F5}.cm.over .res{color:var(--qty)}
.cm.skip .res{color:var(--label)}
.lside{width:380px;flex:none;display:flex;flex-direction:column;min-height:0}
.lside .el-tabs{display:flex;flex-direction:column;min-height:0;flex:1}
.lside .el-tabs__content{flex:1;overflow:auto}
.lside .el-tabs__header{margin:0;padding:0 12px}

/* detail drawer (measured) */
.dtabs{display:flex;border-bottom:1px solid var(--tbl-line);height:46px;align-items:stretch;padding-left:30px;flex:none}
.dtab{width:256px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#333;border-bottom:2px solid transparent;font-size:15px}
.dtab.on{color:var(--pri);border-bottom-color:var(--pri)}
.dsec{font-size:13px;font-weight:700;color:var(--tx-strong);padding:12px 10px 8px}
.igrid{margin:0 10px;border:1px solid var(--tbl-line);display:grid;grid-template-columns:1fr 1.5fr 1.5fr;font-size:13px}
.igrid>div{padding:12px 10px;border-right:1px solid var(--tbl-line);border-bottom:1px solid var(--tbl-line);min-width:0}
.igrid>div:nth-child(3n){border-right:0}
.igrid .lb{background:#FAFAFA;color:var(--label)}
.dlinks{display:flex;gap:18px;padding:0 10px 8px 26px;font-size:13px}
.dlinks button{color:var(--pri);background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-size:13px;padding:0}
.totals{display:grid;grid-template-columns:auto 140px;gap:8px;justify-content:end;padding:10px 20px;align-items:center}
.totals .l{text-align:right;color:var(--tx)}
.totals .v{color:var(--red)}
.dfoot{display:flex;justify-content:flex-end;gap:10px;padding:10px 20px;border-top:1px solid var(--tbl-line);background:#fff;flex:none;flex-wrap:wrap}
.el-drawer__header{margin-bottom:0;padding:12px 16px;border-bottom:1px solid var(--tbl-line)}
.el-drawer__title{font-size:16px;font-weight:700;color:#303133}
.el-drawer__body{padding:0;display:flex;flex-direction:column}
.dscroll{flex:1;overflow:auto}

/* product edit (measured layout) */
.pedit{display:flex;flex:1;min-height:0}
.pedit .lf{flex:1;overflow:auto;padding:20px}
.pedit .rg{width:360px;flex:none;background:#EEE;padding:20px}
.flabel{margin:0 0 6px;color:#333}
.fld{margin-bottom:18px}
.pgrid{display:grid;grid-template-columns:repeat(3,180px);gap:10px}

/* home */
.home{flex:1;background:#F5F5F5;padding:18px 40px 30px;overflow:auto}
.home h1{font-size:18px;margin:0 0 14px;font-weight:700;color:#000}
.home h1 span{color:var(--pri)}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.qcard{aspect-ratio:1/1.35;max-width:100%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34%;cursor:pointer;border:0;font-size:24px;color:#333}
.qcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.14)}
.qcard .el-icon{font-size:52px}
.qcard .t{display:flex;align-items:center;gap:10px}

/* buyer link */
.buyer{flex:1;background:#EEE;padding:20px;overflow:auto}
.phone{width:min(375px,100%);margin:0 auto;background:#F5F5F5;border:1px solid #DDD}
.phone .ph{background:var(--pri);color:#fff;padding:14px 16px}
.phone .pb{padding:10px;display:flex;flex-direction:column;gap:10px}
.phone .card{background:#fff;padding:12px;border-radius:4px}
.phone .pf{background:#fff;padding:10px;border-top:1px solid #E5E5E5}
.opt{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #F2F2F2;cursor:pointer}
.opt:last-child{border-bottom:0}

/* add shop grid */
.shopgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.shopgrid button{height:84px;border:1px solid var(--tbl-line);background:#fff;font-size:18px;font-weight:700;cursor:pointer;position:relative}
.shopgrid button:hover{border-color:var(--pri)}
.shopgrid .new{position:absolute;top:-1px;right:-1px;background:#FF6A00;color:#fff;font-size:10px;padding:0 5px;font-weight:400}

@media (max-width:900px){.cinfo,.lvideo{display:none}.lside{width:300px}.qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.shopgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:767px){
  .rail{display:none}.mob-bar{display:flex}
  .flab{width:auto;text-align:left;padding:7px 8px 0 0;min-width:70px}
  .clist{width:100%}.chat.open .clist{display:none}.chat:not(.open) .cview{display:none}
  .live{flex-direction:column}.lside{width:auto;min-height:340px}.lfeed{min-height:300px;border-right:0}
  .pedit{flex-direction:column}.pedit .rg{width:auto}.pgrid{grid-template-columns:1fr 1fr}
  .home{padding:16px}.igrid{grid-template-columns:1fr}.igrid>div{border-right:0}
  .dtab{width:auto;flex:1}.dtabs{padding-left:0}
  .fct .el-input,.fct .el-select,.fct .el-date-editor{max-width:100%}
}
</style>

<div id="app"></div>

<script type="text/x-template" id="nav-tpl">
  <div class="nav">
    <template v-for="m in menu" :key="m.k">
      <button class="nb" :class="{on:m.k===view&&!m.kids, open:open.includes(m.k)}" @click="m.kids?toggle(m.k):$emit('go',m.k)">
        <span class="ico"><el-icon><component :is="m.i"/></el-icon></span>{{m.t}}
        <span class="cnt" v-if="m.n">{{m.n}}</span><el-icon v-if="m.kids" class="car"><ArrowDown/></el-icon></button>
      <template v-if="m.kids&&open.includes(m.k)"><button v-for="c in m.kids" :key="c.k" class="nb child" :class="{on:c.k===view}" @click="$emit('go',c.k)">{{c.t}}</button></template>
    </template>
  </div>
</script>

<script type="text/x-template" id="pager-tpl">
  <div class="pager"><span v-if="sel!==undefined">เลือก {{sel}} รายการ</span><span class="f12">ทั้งหมด {{total}}</span>

    <side-nav :menu="menu" :view="view" @go="go"/>
    <div class="rail-foot"><el-icon :size="18"><Headset/></el-icon>ติดต่อฝ่ายบริการลูกค้า</div>
  </aside>
  <el-drawer v-model="navOpen" direction="ltr" size="240px" :with-header="false"><div class="rail" style="width:100%;height:100%;display:flex"><div class="rail-top"><div class="logo"><i>ร</i><b>รวม<span>ร้าน</span></b></div></div><side-nav :menu="menu" :view="view" @go="k=>{navOpen=false;go(k)}"/></div></el-drawer>

  <div class="main">
    <div class="mob-bar"><el-button text @click="navOpen=true" aria-label="เมนู"><el-icon :size="20"><Menu/></el-icon></el-button><b>{{titles[view]}}</b></div>
    <div class="view">

    <!-- ========== หน้าหลัก ========== -->
    <div class="home" v-if="view==='home'">
      <div class="row"><h1>รวมร้าน | <span>ทางลัด</span></h1><span class="grow"></span><el-icon :size="22" color="#0094FF" style="cursor:pointer" title="วิดีโอแนะนำ"><VideoPlay/></el-icon></div>
      <div class="qgrid"><button class="qcard" v-for="q in quick" :key="q[1]" @click="go(q[2])"><el-icon><component :is="q[0]"/></el-icon><span class="t">{{q[1]}}<el-icon :size="22"><Right/></el-icon></span></button></div>
    </div>

    <!-- ========== ไลฟ์ ========== -->

        <div class="lfeed"><div class="lhead"><b>คอมเมนต์</b><span class="grow"></span><span class="f12 c-label">เขียว = จับเป็นออเดอร์ · แดง = สต็อกไม่พอ · เทา = ข้าม</span></div>
          <div class="feed"><div v-for="c in feed" :key="c.n" :class="'cm '+c.cls"><span class="who">{{c.who}}</span>{{c.text}}<div class="res" v-if="c.res">{{c.res}} <button class="lk f12" v-if="c.cls==='over'" @click="note('รับเป็นของขายเกินแล้ว')">รับเป็นของขายเกิน</button></div></div></div></div>
        <div class="lside"><el-tabs v-model="liveTab"><el-tab-pane label="สินค้าในรอบ" name="p">

            <p class="f12 c-label" style="padding:8px 12px">คลิกแถวเพื่อปักหมุดสินค้าที่กำลังขาย</p></el-tab-pane>
          <el-tab-pane :label="'ออเดอร์รอบนี้ ('+liveOrders.length+')'" name="o">
            <el-table :data="liveOrders" size="small" empty-text="ไม่มีข้อมูล"><el-table-column label="ผู้ซื้อ" prop="who" min-width="90"/><el-table-column label="สินค้า" width="80"><template #default="{row}">{{row.kw}} × {{row.q}}</template></el-table-column><el-table-column label="ยอด" width="70" align="right"><template #default="{row}">{{baht(row.amt)}}</template></el-table-column><el-table-column label="สถานะ" width="80"><template #default><span style="color:var(--s-pay)">รอชำระ</span></template></el-table-column></el-table></el-tab-pane></el-tabs></div>
      </div>
    </template>

    <!-- ========== ออเดอร์ / ออเดอร์ซัพพลายเออร์ ========== -->
    <template v-if="view==='orders'||view==='dorders'">
      <div class="filters">
        <p v-if="view==='dorders'" class="f12 c-label" style="margin:0 0 6px 10px">ออเดอร์ซัพพลายเออร์คือออเดอร์ที่ตัวแทนส่งให้ซัพพลายเออร์จัดส่ง ยอดเงินคือยอดที่ตัวแทนต้องจ่ายให้ซัพพลายเออร์</p>

        <div class="frow"><div class="flab">ช่องทาง</div><div class="fct"><button class="ob" :class="{on:!of.ch}" @click="of.ch=''">ทั้งหมด</button><button v-for="(n,k) in CH" :key="k" class="ob" :class="{on:of.ch===k}" @click="of.ch=k">{{n}}</button></div></div>
        <div class="frow in"><div class="flab">ป้าย</div><div class="fct" style="gap:12px"><el-select v-model="of.inTag" multiple collapse-tags placeholder="รวมป้าย" style="width:320px"><el-option v-for="t in tagList" :key="t" :label="t" :value="t"/></el-select><el-select v-model="of.exTag" multiple collapse-tags placeholder="ไม่รวมป้าย" style="width:320px"><el-option v-for="t in tagList" :key="t" :label="t" :value="t"/></el-select></div></div>
        <div class="frow in"><div class="flab">เวลา</div><div class="fct"><el-radio-group v-model="of.timeType" class="seg"><el-radio-button value="order">เวลาสั่งซื้อ</el-radio-button><el-radio-button value="pay">เวลาชำระ</el-radio-button><el-radio-button value="due">กำหนดส่ง</el-radio-button></el-radio-group>
          <el-date-picker v-model="of.range" type="datetimerange" start-placeholder="วันเริ่มต้น" end-placeholder="วันสิ้นสุด" style="width:360px;margin-left:-10px"/>

        <template v-if="!of.fold">
        <div class="frow in"><div class="flab">หมดเวลา</div><div class="fct"><el-radio-group v-model="of.toType" class="seg"><el-radio-button value="ship">หมดเวลาจัดส่ง</el-radio-button><el-radio-button value="pick">หมดเวลาเข้ารับ</el-radio-button></el-radio-group><el-select v-model="of.toSel" placeholder="เลือก" style="width:320px;margin-left:-10px"><el-option label="เกินกำหนดแล้ว" value="1"/><el-option label="เหลือไม่ถึง 12 ชม." value="2"/></el-select></div></div>
        <div class="frow in"><div class="flab">รอบไลฟ์</div><div class="fct"><el-select v-model="of.lv" placeholder="เลือกรอบไลฟ์" style="width:320px"><el-option label="LV-1116 · 16/11 20:00" value="a"/><el-option label="LV-1114 · 14/11 20:00" value="b"/></el-select></div></div>

        <div class="frow"><div class="flab">ข้อความ | หมายเหตุ</div><div class="fct"><button class="ob" v-for="d in ['ทั้งหมด','มีข้อความลูกค้า','ไม่มีข้อความ','มีหมายเหตุ','ไม่มีหมายเหตุ']" :key="d" :class="{on:(of.msg||'ทั้งหมด')===d}" @click="of.msg=d">{{d}}</button></div></div>
        <div class="frow"><div class="flab">สถานะขนส่ง</div><div class="fct"><button class="ob on">ทั้งหมด</button><button class="ob">รอเข้ารับ<em>(0)</em></button><button class="ob">กำลังเข้ารับ<em>(0)</em></button><button class="ob">เข้ารับไม่สำเร็จ<em>(0)</em></button></div></div>

        <div class="frow in"><div class="flab">ค้นหาด่วน</div><div class="fct" style="gap:0"><el-radio-group v-model="of.qType" class="seg"><el-radio-button value="id">เลขออเดอร์</el-radio-button><el-radio-button value="track">เลขพัสดุ</el-radio-button><el-radio-button value="cust">ชื่อผู้ซื้อ</el-radio-button></el-radio-group><el-input v-model="of.q" placeholder="กรอกแล้วกด Enter เพื่อค้นหา" style="width:320px" clearable/></div></div>
        <div class="frow in"><div class="flab"></div><div class="fct"><el-button class="btn-search" :icon="'Search'">ค้นหา</el-button><el-button class="btn-reset" @click="resetFilter">ล้าง</el-button><button class="save-flt" @click="note('บันทึกเงื่อนไขกรองแล้ว')"><el-icon><Setting/></el-icon>บันทึกเงื่อนไขกรอง</button><button class="save-flt" @click="of.fold=!of.fold">{{of.fold?'แสดงตัวกรองทั้งหมด':'ย่อตัวกรอง'}}</button></div></div>

        <button class="tb" @click="note('ทำเครื่องหมายผิดปกติแล้ว')"><el-icon><DocumentDelete/></el-icon>ทำเครื่องหมายผิดปกติ</button>
        <el-dropdown trigger="click" @command="c=>note(c)"><button class="tb"><el-icon><DocumentChecked/></el-icon>ยกเลิกเครื่องหมาย<el-icon><ArrowDown/></el-icon></button><template #dropdown><el-dropdown-menu><el-dropdown-item command="ยกเลิกเครื่องหมายแล้ว">ยกเลิกเครื่องหมายผิดปกติ</el-dropdown-item></el-dropdown-menu></template></el-dropdown>
        <el-dropdown trigger="click" @command="bulkCancel"><button class="tb">ยกเลิก<el-icon><ArrowDown/></el-icon></button><template #dropdown><el-dropdown-menu><el-dropdown-item command="c">ยกเลิกออเดอร์ที่เลือก</el-dropdown-item></el-dropdown-menu></template></el-dropdown>
        <el-dropdown trigger="click" @command="c=>note(c)"><button class="tb"><el-icon><Collection/></el-icon>แก้ไขแบบกลุ่ม<el-icon><ArrowDown/></el-icon></button><template #dropdown><el-dropdown-menu><el-dropdown-item command="ตั้งคลังแล้ว">ตั้งคลังสินค้า</el-dropdown-item><el-dropdown-item command="ติดป้ายแล้ว">ติดป้าย</el-dropdown-item><el-dropdown-item command="เปลี่ยนเป็นเก็บปลายทางแล้ว">เปลี่ยนเป็นเก็บปลายทาง</el-dropdown-item><el-dropdown-item command="ยกเลิกเก็บปลายทางแล้ว">ยกเลิกเก็บปลายทาง</el-dropdown-item><el-dropdown-item command="คำนวณออเดอร์ใหม่แล้ว">คำนวณออเดอร์ใหม่</el-dropdown-item><el-dropdown-item command="แยกสินค้าชุดแล้ว">แยกสินค้าชุด</el-dropdown-item></el-dropdown-menu></template></el-dropdown>
        <div class="tb-r"><span class="f12">เลือก {{sel.length}} รายการ</span><span class="f12">ทั้งหมด {{filtered.length}}</span><el-icon title="เรียงลำดับ"><Sort/></el-icon><el-icon title="ส่งออก"><Download/></el-icon></div>
      </div>
      <div class="tbl"><div class="otbl">
        <div class="ohead"><div class="chk"><el-checkbox :model-value="sel.length>0&&sel.length===filtered.length" :indeterminate="sel.length>0&&sel.length<filtered.length" @change="v=>sel=v?filtered.map(o=>o.id):[]" aria-label="เลือกทั้งหมด"/></div>
          <div class="ocols"><div>ข้อมูลสินค้า<el-icon style="margin-left:auto;color:#999"><Setting/></el-icon></div><div>ยอดเงิน</div><div>ป้าย / หมายเหตุ</div><div>คลัง</div><div>ข้อมูลขนส่ง</div><div>ข้อมูลจัดส่ง</div><div>เวลา</div></div></div>
        <div class="ord" v-for="o in filtered" :key="o.id"><div class="bar" :style="{background:SC[o.st]}"></div><div class="rt">
          <div class="ostrip"><div class="chk"><el-checkbox :model-value="sel.includes(o.id)" @change="v=>toggleSel(o.id,v)" :aria-label="'เลือก '+o.id"/></div>
            <span class="ostat" :style="{color:SC[o.st]}"><span class="ring" :style="{background:SC[o.st]}"></span>{{ST[o.st]}}</span>

            <div class="num"><b>{{baht(total(o))}}</b><div>ค่าส่ง : {{o.fee||0}}</div><div>ส่วนลด : 0</div></div>

          </div></div></div></div>

      </div></div>
      <pager :total="filtered.length" :sel="sel.length"/>

    <!-- ========== รายชื่อตัวแทน ========== -->

      <empty-box text="ยังไม่ได้ผูกซัพพลายเออร์ กรุณาผูกซัพพลายเออร์ก่อน" style="padding-top:160px"><el-button type="primary" style="margin-top:14px" :icon="'Plus'" @click="note('เปิดหน้าผูกซัพพลายเออร์')">ผูกซัพพลายเออร์</el-button></empty-box>
    </template>

    <!-- ========== สินค้า ========== -->

      <div class="filters">
        <div class="frow"><div class="flab">หมวดสินค้า</div><div class="fct"><button class="ob on">ทั้งหมด</button><button class="ob">เสื้อผ้า</button><button class="ob">กระเป๋าและหมวก</button><button class="ob">ยังไม่ตั้ง</button></div></div>
        <div class="frow"><div class="flab">สถานะ</div><div class="fct"><button class="ob" :class="{on:pf.st===''}" @click="pf.st=''">ทั้งหมด</button><button class="ob" :class="{on:pf.st==='on'}" @click="pf.st='on'">เปิดใช้</button><button class="ob" :class="{on:pf.st==='off'}" @click="pf.st='off'">ปิดใช้</button></div></div>
        <div class="frow in"><div class="flab">ค้นหาด่วน</div><div class="fct" style="gap:0"><el-radio-group v-model="pf.qt" class="seg"><el-radio-button value="spu">รหัสสินค้า</el-radio-button><el-radio-button value="sku">SKU</el-radio-button><el-radio-button value="name">ชื่อสินค้า</el-radio-button></el-radio-group><el-input v-model="pf.q" style="width:320px" clearable aria-label="คำค้น"/></div></div>
