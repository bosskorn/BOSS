<title>รวมร้าน 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*__ELEMENT_CSS__*/</style>
<style>/*__DARK_CSS__*/</style>
<style>/*__MODERN_CSS__*/</style>

<div id="app"></div>

<script type="text/x-template" id="nav-tpl">
  <div class="nav">
    <template v-for="m in menu" :key="m.k">
      <div class="nsec" v-if="m.sec">{{m.sec}}</div>
      <button class="nb" :class="{on:m.k===view&&!m.kids||(mini&&m.kids&&m.kids.some(c=>c.k===view)), open:open.includes(m.k)}" :title="m.t" @click="m.kids?(mini?$emit('go',m.kids[0].k):toggle(m.k)):$emit('go',m.k)">
        <span class="ico"><el-icon><component :is="m.i"/></el-icon></span><span class="lbl">{{m.t}}</span>
        <span class="cnt" v-if="m.n">{{m.n}}</span><el-icon v-if="m.kids" class="car"><ArrowDown/></el-icon></button>
      <template v-if="m.kids&&open.includes(m.k)"><button v-for="c in m.kids" :key="c.k" class="nb child" :class="{on:c.k===view}" @click="$emit('go',c.k)">{{c.t}}</button></template>
    </template>
  </div>
</script>

<script type="text/x-template" id="pager-tpl">
  <div class="pager"><span v-if="sel!==undefined">เลือก {{sel}} รายการ</span><span class="f12">ทั้งหมด {{total}}</span>
    <el-select model-value="20" size="small" style="width:110px" aria-label="จำนวนต่อหน้า"><el-option label="20/หน้า" value="20"/><el-option label="50/หน้า" value="50"/><el-option label="100/หน้า" value="100"/></el-select>
    <el-pagination layout="prev, pager, next" :total="total" :page-size="20" small/>
    <span class="f12">ไปที่</span><el-input model-value="1" size="small" style="width:46px" aria-label="ไปที่หน้า"/></div>
</script>

<script type="text/x-template" id="empty-tpl">
  <div class="empty"><el-icon><Box/></el-icon><p>{{text||'ไม่มีข้อมูล'}}</p><slot/></div>
</script>

<script type="text/x-template" id="app-tpl">
<el-config-provider :locale="locale">
<div class="shell">
  <aside class="rail" :class="{mini:collapsed}">
    <div class="rail-top"><div class="logo"><i>ร</i><b v-show="!collapsed">รวม<span>ร้าน</span></b></div></div>
    <el-dropdown trigger="click" style="display:block"><div class="ws"><span class="ava">บ</span><div class="grow"><div class="nm">บ้านผ้าฝ้าย</div><div class="sub">ทดลองใช้ · เหลือ 15 วัน</div></div><el-icon color="#8892A3"><ArrowDown/></el-icon></div>
      <template #dropdown><el-dropdown-menu><el-dropdown-item>บ้านผ้าฝ้าย</el-dropdown-item><el-dropdown-item>+ เพิ่มร้านใหม่</el-dropdown-item><el-dropdown-item divided>แพ็กเกจและการชำระเงิน</el-dropdown-item></el-dropdown-menu></template></el-dropdown>
    <side-nav :menu="menu" :view="view" :mini="collapsed" @go="go"/>
    <div class="rail-foot"><button class="nb" :title="'ติดต่อฝ่ายบริการลูกค้า'"><span class="ico"><el-icon><Headset/></el-icon></span><span class="lbl">ติดต่อฝ่ายบริการลูกค้า</span></button><button class="nb" @click="collapsed=!collapsed" :title="collapsed?'ขยายเมนู':'ย่อเมนู'"><span class="ico"><el-icon><component :is="collapsed?'Expand':'Fold'"/></el-icon></span><span class="lbl">ย่อเมนู</span></button></div>
  </aside>
  <el-drawer v-model="navOpen" direction="ltr" size="250px" :with-header="false"><div class="rail" style="width:100%;height:100%;border:0"><div class="rail-top"><div class="logo"><i>ร</i><b>รวม<span>ร้าน</span></b></div></div><side-nav :menu="menu" :view="view" @go="k=>{navOpen=false;go(k)}"/></div></el-drawer>

  <div class="main">
    <header class="topbar">
      <button class="ib mob-only" @click="navOpen=true" aria-label="เมนู" v-if="isMobile"><el-icon><Menu/></el-icon></button>
      <div class="crumb"><span>{{crumbs[view]||'รวมร้าน'}}</span><span v-if="crumbs[view]">/</span><b>{{titles[view]}}</b></div>
      <button class="cmdk" @click="openK" aria-label="ค้นหาและคำสั่ง"><el-icon><Search/></el-icon><span>ค้นหาออเดอร์ สินค้า หรือหน้า</span><kbd>⌘K</kbd></button>
      <button class="ib" @click="toggleDark" :aria-label="dark?'โหมดสว่าง':'โหมดมืด'" :title="dark?'โหมดสว่าง':'โหมดมืด'"><el-icon><component :is="dark?'Sunny':'Moon'"/></el-icon></button>
      <el-popover trigger="click" width="300" placement="bottom-end"><template #reference><button class="ib" aria-label="การแจ้งเตือน"><el-icon><Bell/></el-icon><span class="dot"></span></button></template>
        <div class="b" style="margin-bottom:8px">การแจ้งเตือน</div><div class="f13" v-for="n in notis" :key="n" style="padding:8px 0;border-top:1px solid var(--line-2)">{{n}}</div></el-popover>
      <el-dropdown trigger="click"><span class="ava" style="width:34px;height:34px;cursor:pointer">ก</span>
        <template #dropdown><el-dropdown-menu><el-dropdown-item disabled>กรธนพัฒน์ · ผู้ดูแลระบบ</el-dropdown-item><el-dropdown-item divided>ศูนย์ช่วยเหลือ</el-dropdown-item><el-dropdown-item>ดาวน์โหลดแอป</el-dropdown-item><el-dropdown-item>เปลี่ยนรหัสผ่าน</el-dropdown-item><el-dropdown-item divided>ออกจากระบบ</el-dropdown-item></el-dropdown-menu></template></el-dropdown>
    </header>
    <div class="view">

    <!-- ========== หน้าหลัก ========== -->
    <div class="home" v-if="view==='home'">
      <div class="hello"><div><h1>สวัสดีตอนเช้า บ้านผ้าฝ้าย</h1><p>วันจันทร์ 16 พ.ย. 2026 · มีงานรอจัดการ {{tasks.reduce((a,t)=>a+t[1],0)}} รายการ</p></div><span class="grow"></span><el-button :icon="'Plus'" @click="newOrder">สร้างออเดอร์</el-button><el-button type="primary" :icon="'VideoCamera'" @click="go('live')">เริ่มไลฟ์</el-button></div>
      <div class="cards" style="margin:0"><div class="kcard" v-for="k in homeKpis" :key="k[0]"><span class="ci" :style="{background:k[3]}"><el-icon><component :is="k[4]"/></el-icon></span><span class="d" :style="{color:k[2][0]==='-'?'var(--red)':'var(--s-sent)'}">{{k[2]}}</span><div class="k">{{k[0]}}</div><div class="v num">{{k[1]}}</div><svg width="64" height="22" viewBox="0 0 64 22" aria-hidden="true"><polyline :points="k[5]" fill="none" :stroke="k[3]" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <div class="hgrid">
        <div class="card"><div class="chead2"><h3>งานที่ต้องทำ</h3><span class="grow"></span><span class="f12 c-label">อัปเดตเมื่อสักครู่</span></div>
          <div class="todo"><button v-for="t in tasks" :key="t[0]" @click="t[2]?setTab(t[2]):go(t[3])"><div class="n num" :style="{color:t[1]?'var(--tx)':'var(--tx-3)'}">{{t[1]}}</div><div class="t">{{t[0]}}</div></button></div>
          <div class="chead2" style="padding-top:4px"><h3>ยอดขาย 7 วัน</h3><span class="grow"></span><button class="lk f13" @click="go('rsales')">ดูรายงาน</button></div>
          <div class="bars"><div class="bar" v-for="d in days" :key="d[0]"><span class="num">{{(d[1]/1000).toFixed(1)}}k</span><i :style="{height:Math.round(d[1]/12400*100)+'px'}"></i><span>{{d[0]}}</span></div></div></div>
        <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
          <div class="card"><div class="chead2"><h3>ทางลัด</h3></div><div class="qgrid"><button class="qcard" v-for="q in quick" :key="q[1]" @click="go(q[2])"><el-icon><component :is="q[0]"/></el-icon>{{q[1]}}</button></div></div>
          <div class="card"><div class="chead2" style="padding-bottom:10px"><h3>ช่องทางที่เชื่อมอยู่</h3><span class="grow"></span><button class="lk f13" @click="go('sauth')">จัดการ</button></div>
            <div class="chrow" v-for="c in shops" :key="c.id"><span :class="'chn '+c.k"><b>{{CHI[c.k]}}</b></span><span class="grow f13">{{c.name}}</span><span class="pill" :style="{color:c.warn?'var(--s-ship)':'var(--s-sent)'}">{{c.warn?'ใกล้หมดอายุ':'เชื่อมอยู่'}}</span></div></div>
        </div>
      </div>
    </div>

    <!-- ========== ไลฟ์ ========== -->
    <template v-if="view==='live'">
      <div class="toolbar livebar"><b class="c-pri">เลือกเพจ:</b><span class="chn fb"><b>f</b>บ้านผ้าฝ้าย Official</span><el-tag type="danger" size="small" effect="dark">กำลังไลฟ์</el-tag>
        <span class="c-reg">รอบ LV-1116</span><div class="tb-r"><button class="tb" @click="liveOn=!liveOn"><el-icon><component :is="liveOn?'VideoPause':'VideoPlay'"/></el-icon>{{liveOn?'หยุดคอมเมนต์ตัวอย่าง':'เล่นคอมเมนต์ตัวอย่าง'}}</button><el-button type="primary" size="small" @click="note('สรุปรอบ: '+liveOrders.length+' ออเดอร์ ยอด '+baht(liveSum))">จบไลฟ์และสรุปรอบ</el-button></div></div>
      <div class="live">
        <div class="lvideo"><div class="screen"><span class="onair">LIVE</span><div>พื้นที่วิดีโอไลฟ์<div class="f12" style="opacity:.6;margin-top:4px">ภาพจากเพจที่เชื่อมไว้</div></div></div>
          <div class="lstat"><div><b class="num">214</b><span class="f12 c-label">ผู้ชม</span></div><div><b class="num">{{liveOrders.length}}</b><span class="f12 c-label">ออเดอร์</span></div><div><b class="num">{{baht(liveSum)}}</b><span class="f12 c-label">ยอดขาย</span></div></div></div>
        <div class="lfeed"><div class="lhead"><b>คอมเมนต์</b><span class="grow"></span><span class="f12 c-label">เขียว = จับเป็นออเดอร์ · แดง = สต็อกไม่พอ · เทา = ข้าม</span></div>
          <div class="feed"><div v-for="c in feed" :key="c.n" :class="'cm '+c.cls"><span class="who">{{c.who}}</span>{{c.text}}<div class="res" v-if="c.res">{{c.res}} <button class="lk f12" v-if="c.cls==='over'" @click="note('รับเป็นของขายเกินแล้ว')">รับเป็นของขายเกิน</button></div></div></div></div>
        <div class="lside"><el-tabs v-model="liveTab"><el-tab-pane label="สินค้าในรอบ" name="p">
            <el-table :data="products" size="small" @row-click="r=>{pinned=r.kw;note('ปักหมุด '+r.name)}" :row-style="r=>r.row.kw===pinned?{background:'#ECF5FF'}:{}"><el-table-column label="คีย์เวิร์ด" width="80"><template #default="{row}"><span class="c-pri b">{{row.kw}}</span></template></el-table-column><el-table-column label="สินค้า" prop="name" min-width="130" show-overflow-tooltip/><el-table-column label="ราคา" width="64" align="right" prop="price"/><el-table-column label="สต็อก" width="64" align="right"><template #default="{row}"><span :class="{'c-red':row.stock<5}">{{row.stock}}</span></template></el-table-column></el-table>
            <p class="f12 c-label" style="padding:8px 12px">คลิกแถวเพื่อปักหมุดสินค้าที่กำลังขาย</p></el-tab-pane>
          <el-tab-pane :label="'ออเดอร์รอบนี้ ('+liveOrders.length+')'" name="o">
            <el-table :data="liveOrders" size="small" empty-text="ไม่มีข้อมูล"><el-table-column label="ผู้ซื้อ" prop="who" min-width="90"/><el-table-column label="สินค้า" width="80"><template #default="{row}">{{row.kw}} × {{row.q}}</template></el-table-column><el-table-column label="ยอด" width="70" align="right"><template #default="{row}">{{baht(row.amt)}}</template></el-table-column><el-table-column label="สถานะ" width="80"><template #default><span style="color:var(--s-pay)">รอชำระ</span></template></el-table-column></el-table></el-tab-pane></el-tabs></div>
      </div>
    </template>

    <!-- ========== ออเดอร์ / ออเดอร์ซัพพลายเออร์ ========== -->
    <template v-if="view==='orders'||view==='dorders'">
      <div class="filters">
        <p v-if="view==='dorders'" class="f12 c-label" style="margin:0 0 6px 10px">ออเดอร์ซัพพลายเออร์คือออเดอร์ที่ตัวแทนส่งให้ซัพพลายเออร์จัดส่ง ยอดเงินคือยอดที่ตัวแทนต้องจ่ายให้ซัพพลายเออร์</p>
        <div class="frow"><div class="flab">ออเดอร์</div><div class="fct"><button v-for="t in tabs" :key="t" class="ob" :class="{on:of.tab===t}" @click="of.tab=t;sel=[]">{{t==='all'?'ทั้งหมด':ST[t]}}<em v-if="['pay','ship','print','pickup'].includes(t)">({{view==='dorders'?0:cnt(t)}})</em></button></div></div>
        <div class="frow"><div class="flab">ช่องทาง</div><div class="fct"><button class="ob" :class="{on:!of.ch}" @click="of.ch=''">ทั้งหมด</button><button v-for="(n,k) in CH" :key="k" class="ob" :class="{on:of.ch===k}" @click="of.ch=k">{{n}}</button></div></div>
        <div class="frow in"><div class="flab">ป้าย</div><div class="fct" style="gap:12px"><el-select v-model="of.inTag" multiple collapse-tags placeholder="รวมป้าย" style="width:320px"><el-option v-for="t in tagList" :key="t" :label="t" :value="t"/></el-select><el-select v-model="of.exTag" multiple collapse-tags placeholder="ไม่รวมป้าย" style="width:320px"><el-option v-for="t in tagList" :key="t" :label="t" :value="t"/></el-select></div></div>
        <div class="frow in"><div class="flab">เวลา</div><div class="fct"><el-radio-group v-model="of.timeType" class="seg"><el-radio-button value="order">เวลาสั่งซื้อ</el-radio-button><el-radio-button value="pay">เวลาชำระ</el-radio-button><el-radio-button value="due">กำหนดส่ง</el-radio-button></el-radio-group>
          <el-date-picker v-model="of.range" type="datetimerange" start-placeholder="วันเริ่มต้น" end-placeholder="วันสิ้นสุด" style="width:360px;margin-left:-10px"/>
          <button class="ob" v-for="d in ['เมื่อวาน','วันนี้','7 วัน','15 วัน']" :key="d" :class="{on:of.quick===d}" @click="of.quick=d" style="margin-left:6px">{{d}}</button></div></div>
        <template v-if="!of.fold">
        <div class="frow in"><div class="flab">หมดเวลา</div><div class="fct"><el-radio-group v-model="of.toType" class="seg"><el-radio-button value="ship">หมดเวลาจัดส่ง</el-radio-button><el-radio-button value="pick">หมดเวลาเข้ารับ</el-radio-button></el-radio-group><el-select v-model="of.toSel" placeholder="เลือก" style="width:320px;margin-left:-10px"><el-option label="เกินกำหนดแล้ว" value="1"/><el-option label="เหลือไม่ถึง 12 ชม." value="2"/></el-select></div></div>
        <div class="frow in"><div class="flab">รอบไลฟ์</div><div class="fct"><el-select v-model="of.lv" placeholder="เลือกรอบไลฟ์" style="width:320px"><el-option label="LV-1116 · 16/11 20:00" value="a"/><el-option label="LV-1114 · 14/11 20:00" value="b"/></el-select></div></div>
        <div class="frow"><div class="flab">ใกล้หมดเวลา</div><div class="fct"><button class="ob" :class="{on:!of.due}" @click="of.due=''">ทั้งหมด</button><button class="ob" v-for="d in ['0–6 ชม.','6–12 ชม.','12–24 ชม.']" :key="d" :class="{on:of.due===d}" @click="of.due=d">{{d}}</button></div></div>
        <div class="frow"><div class="flab">ข้อความ | หมายเหตุ</div><div class="fct"><button class="ob" v-for="d in ['ทั้งหมด','มีข้อความลูกค้า','ไม่มีข้อความ','มีหมายเหตุ','ไม่มีหมายเหตุ']" :key="d" :class="{on:(of.msg||'ทั้งหมด')===d}" @click="of.msg=d">{{d}}</button></div></div>
        <div class="frow"><div class="flab">สถานะขนส่ง</div><div class="fct"><button class="ob on">ทั้งหมด</button><button class="ob">รอเข้ารับ<em>(0)</em></button><button class="ob">กำลังเข้ารับ<em>(0)</em></button><button class="ob">เข้ารับไม่สำเร็จ<em>(0)</em></button></div></div>
        </template>
        <div class="frow in"><div class="flab">ค้นหาด่วน</div><div class="fct" style="gap:0"><el-radio-group v-model="of.qType" class="seg"><el-radio-button value="id">เลขออเดอร์</el-radio-button><el-radio-button value="track">เลขพัสดุ</el-radio-button><el-radio-button value="cust">ชื่อผู้ซื้อ</el-radio-button></el-radio-group><el-input v-model="of.q" placeholder="กรอกแล้วกด Enter เพื่อค้นหา" style="width:320px" clearable/></div></div>
        <div class="frow in"><div class="flab"></div><div class="fct"><el-button class="btn-search" :icon="'Search'">ค้นหา</el-button><el-button class="btn-reset" @click="resetFilter">ล้าง</el-button><button class="save-flt" @click="note('บันทึกเงื่อนไขกรองแล้ว')"><el-icon><Setting/></el-icon>บันทึกเงื่อนไขกรอง</button><button class="save-flt" @click="of.fold=!of.fold">{{of.fold?'แสดงตัวกรองทั้งหมด':'ย่อตัวกรอง'}}</button></div></div>
      </div>
      <div class="toolbar">
        <el-dropdown trigger="click" @command="toolCmd"><button class="tb pri"><el-icon><Plus/></el-icon>เพิ่มออเดอร์<el-icon><ArrowDown/></el-icon></button><template #dropdown><el-dropdown-menu><el-dropdown-item command="new">สร้างออเดอร์</el-dropdown-item><el-dropdown-item command="sync">ดาวน์โหลดออเดอร์จากร้าน</el-dropdown-item><el-dropdown-item command="sync">ดาวน์โหลดออเดอร์ที่เลือก</el-dropdown-item><el-dropdown-item command="sync">ซิงก์ออเดอร์ตามเงื่อนไข</el-dropdown-item></el-dropdown-menu></template></el-dropdown>
        <el-dropdown trigger="click" v-if="bulk" @command="bulkNext"><button class="tb"><el-icon><CircleCheck/></el-icon>{{bulk[0]}}<el-icon><ArrowDown/></el-icon></button><template #dropdown><el-dropdown-menu><el-dropdown-item command="sel">ทำกับรายการที่เลือก</el-dropdown-item><el-dropdown-item command="all">ทำทั้งหมดในแท็บนี้</el-dropdown-item></el-dropdown-menu></template></el-dropdown>
        <button class="tb" @click="note('ทำเครื่องหมายผิดปกติแล้ว')"><el-icon><DocumentDelete/></el-icon>ทำเครื่องหมายผิดปกติ</button>
        <el-dropdown trigger="click" @command="c=>note(c)"><button class="tb"><el-icon><DocumentChecked/></el-icon>ยกเลิกเครื่องหมาย<el-icon><ArrowDown/></el-icon></button><template #dropdown><el-dropdown-menu><el-dropdown-item command="ยกเลิกเครื่องหมายแล้ว">ยกเลิกเครื่องหมายผิดปกติ</el-dropdown-item></el-dropdown-menu></template></el-dropdown>
