<style>
/* Layout: Ruamraan's own system — dark slate rail, page header on every screen, one content card per page (tabs → chip filter bar → table → pager), right-side detail panel. Teal brand, Noto Sans Thai + Inter. Light + dark. */
:root{
  --brand:#0E9F87; --brand-ink:#0A7F6C; --brand-soft:#E2F5F1; --brand-soft-2:#C8EDE5; --live:#FF5A5F;

  --tx:#16212A; --tx-2:#475562; --tx-3:#83919D;
  --rail:#0F171B; --rail-2:#18242A; --rail-tx:#9FB0BA; --rail-hi:#FFFFFF;
  --red:#E5484D; --warn:#E8890C;
  --s-pay:#D97706; --s-ship:#2563EB; --s-print:#7C3AED; --s-pickup:#0891B2; --s-sent:#16A34A; --s-cancel:#83919D;

  --r:14px; --r-s:10px;
  --font:"Inter","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --el-color-primary:#0E9F87; --el-color-primary-light-3:#56BCAB; --el-color-primary-light-5:#87CFC3; --el-color-primary-light-7:#B7E2DB; --el-color-primary-light-8:#CFEBE6; --el-color-primary-light-9:#E2F5F1; --el-color-primary-dark-2:#0B7F6C;
  --el-font-family:var(--font); --el-font-size-base:14px; --el-border-radius-base:10px; --el-border-radius-small:8px;
  --el-bg-color:var(--surface); --el-bg-color-overlay:var(--surface); --el-fill-color-blank:var(--surface); --el-border-color:#D9E0E5; --el-border-color-light:var(--line); --el-border-color-lighter:var(--line-2);
  --el-text-color-primary:var(--tx); --el-text-color-regular:var(--tx-2);
  --el-table-header-bg-color:var(--surface); --el-table-header-text-color:var(--tx-3); --el-table-text-color:var(--tx); --el-table-border-color:var(--line-2); --el-table-row-hover-bg-color:var(--surface-2); --el-table-tr-bg-color:var(--surface); --el-table-bg-color:var(--surface);
}
html.dark{
  --brand:#2CC4A7; --brand-ink:#5DD9C1; --brand-soft:rgba(44,196,167,.14); --brand-soft-2:rgba(44,196,167,.26); --live:#FF7477;
  --bg:#0C1215; --surface:#141C20; --surface-2:#192328; --line:#243036; --line-2:#1F2A30;
  --tx:#E5ECEF; --tx-2:#AFBDC5; --tx-3:#76868F;
  --rail:#090E10; --rail-2:#152024;
  --s-pay:#F5A524; --s-ship:#5B8CFF; --s-print:#A78BFA; --s-pickup:#22D3EE; --s-sent:#4ADE80; --s-cancel:#76868F;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 12px 32px rgba(0,0,0,.55);
  --el-color-primary:#2CC4A7; --el-color-primary-light-3:#23977F; --el-color-primary-light-5:#1C7363; --el-color-primary-light-7:#164F45; --el-color-primary-light-8:#143F37; --el-color-primary-light-9:#12302B; --el-color-primary-dark-2:#5DD9C1;
  --el-bg-color:var(--surface); --el-bg-color-overlay:#192328; --el-fill-color-blank:var(--surface); --el-border-color:#2C3940; --el-border-color-light:var(--line); --el-border-color-lighter:var(--line-2);
  --el-text-color-primary:var(--tx); --el-text-color-regular:var(--tx-2);
  --el-table-header-bg-color:var(--surface); --el-table-header-text-color:var(--tx-3); --el-table-text-color:var(--tx); --el-table-border-color:var(--line-2); --el-table-row-hover-bg-color:#1B262B; --el-table-tr-bg-color:var(--surface); --el-table-bg-color:var(--surface);
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
#app{height:100%}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.b{font-weight:600}.c3{color:var(--tx-3)}.c2{color:var(--tx-2)}.cr{color:var(--red)}.cb{color:var(--brand)}.f12{font-size:12px}.f13{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}

/* shell */
.shell{height:100%;display:flex}
.rail{width:236px;flex:none;background:var(--rail);color:var(--rail-tx);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .2s}
.rail.mini{width:72px}
.brandbox{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.mark{width:34px;height:34px;flex:none;border-radius:11px;background:conic-gradient(from 210deg,#2CC4A7,#0E9F87,#0A6E5E,#2CC4A7);display:grid;place-items:center;color:#fff;font-weight:700;position:relative}
.mark::after{content:"";position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--live);border:2px solid var(--rail)}
.brandbox b{color:#fff;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.shopsel{margin:0 12px 8px;padding:9px 10px;border-radius:12px;background:var(--rail-2);display:flex;align-items:center;gap:10px;cursor:pointer;color:#fff}
.shopsel small{display:block;color:var(--rail-tx);font-size:11px}
.rail.mini .shopsel{justify-content:center}.rail.mini .shopsel>div,.rail.mini .shopsel>.el-icon,.rail.mini .brandbox b{display:none}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.nb{height:40px;display:flex;align-items:center;gap:12px;padding:0 12px;border:0;background:none;color:var(--rail-tx);border-radius:10px;cursor:pointer;font-size:14px;white-space:nowrap;width:100%;text-align:left}
.nb .el-icon{font-size:18px;flex:none}
.nb:hover{background:var(--rail-2);color:#fff}
.nb.on{background:linear-gradient(90deg,rgba(44,196,167,.22),rgba(44,196,167,.06));color:#fff;box-shadow:inset 2px 0 0 #2CC4A7}
.nb.on .el-icon{color:#2CC4A7}
.nb .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--live);color:#fff;border-radius:10px;min-width:20px;text-align:center;line-height:18px;padding:0 6px}
.nb .live{margin-left:auto;font-size:10px;font-weight:700;color:#fff;background:var(--live);border-radius:6px;padding:0 6px;line-height:16px;letter-spacing:.05em}
.rail.mini .nb{justify-content:center;padding:0;position:relative}.rail.mini .nb .lbl{display:none}.rail.mini .nb .cnt,.rail.mini .nb .live{position:absolute;top:2px;right:4px;margin:0}
.ngap{height:1px;background:var(--rail-2);margin:8px 12px}
.rail-foot{margin-top:auto;padding:10px;display:flex;flex-direction:column;gap:2px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.search{display:flex;align-items:center;gap:8px;height:38px;width:420px;max-width:46vw;padding:0 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--tx-3);cursor:pointer;font-size:13px}
.search kbd{margin-left:auto;font:600 11px var(--font);color:var(--tx-3);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface)}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--tx-2);cursor:pointer;position:relative;font-size:18px;flex:none}
.ib:hover{color:var(--brand);border-color:var(--brand-soft-2)}
.ib .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--live)}
.me{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 6px 4px 4px;border-radius:12px}
.me:hover{background:var(--surface-2)}
.view{flex:1;min-height:0;overflow:auto;padding:22px 28px 28px}

/* page */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;color:var(--tx)}
.ph p{margin:2px 0 0;color:var(--tx-3)}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.card+.card{margin-top:16px}
.ch{display:flex;align-items:center;gap:8px;padding:16px 18px 0}
.ch h3{margin:0;font-size:15px;font-weight:600}
.stabs{display:flex;gap:4px;padding:6px 10px 0;border-bottom:1px solid var(--line-2);overflow-x:auto}
.stab{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:0;background:none;color:var(--tx-2);cursor:pointer;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.stab:hover{color:var(--tx)}
.stab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.stab i{font-style:normal;font-size:11px;font-weight:700;min-width:20px;line-height:19px;border-radius:10px;text-align:center;padding:0 6px;background:var(--surface-2);color:var(--tx-3);border:1px solid var(--line)}
.stab.on i{background:var(--brand);color:#fff;border-color:var(--brand)}
.fbar{display:flex;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap}
.fsearch{flex:1 1 260px;min-width:200px;max-width:420px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;border:1px dashed var(--el-border-color);background:none;color:var(--tx-2);cursor:pointer;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.set{border-style:solid;border-color:var(--brand-soft-2);background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
html.dark .chip.set{color:var(--brand)}
.chip .x{margin-left:2px;opacity:.7}
.fbar .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.optlist{display:flex;flex-direction:column;gap:2px}
.optlist button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--tx);text-align:left;font-size:13px}
.optlist button:hover{background:var(--surface-2)}
.optlist button.on{color:var(--brand);font-weight:600;background:var(--brand-soft)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line-2);color:var(--tx-3);font-size:13px;flex-wrap:wrap}
.empty{padding:56px 16px;text-align:center;color:var(--tx-3)}
.empty .ill{width:72px;height:72px;border-radius:22px;margin:0 auto 12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:30px}
.empty b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}
.lk{color:var(--brand);background:none;border:0;padding:0;cursor:pointer;font-size:inherit}
.lk:hover{text-decoration:underline}
.lk+.lk{margin-left:14px}

/* table */
.el-table th.el-table__cell{font-weight:600;font-size:12px;height:44px;padding:6px 0;text-transform:none;border-bottom:1px solid var(--line)!important}

.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.code{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--tx)}
.ch-ico{width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.fb{background:#1877F2}.tt{background:#111}.sp{background:#EE4D2D}.lz{background:#0F146D}.ln{background:#06C755}
html.dark .tt{background:#2A3338}
.av{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);flex:none}
html.dark .av{color:var(--brand)}
.stockbar{height:6px;border-radius:4px;background:var(--line-2);overflow:hidden;margin-top:6px;width:110px}
.stockbar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.bulk{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;background:var(--rail);color:#fff;border-radius:16px;box-shadow:var(--sh-2);white-space:nowrap;max-width:calc(100% - 32px);overflow-x:auto}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .k{color:var(--tx-3);font-size:13px;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:4px}
.kpi .d{font-size:12px;font-weight:600}
.kpi>svg{position:absolute;right:14px;bottom:16px}
.kpis>.card{margin-top:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2>.card+.card,.col>.card+.card{margin-top:0}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.queue{display:flex;flex-direction:column}
.qi{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line-2);cursor:pointer}
.qi:first-child{border-top:0}
.qi:hover{background:var(--surface-2)}
.qi .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none}
.qi .n{font-size:18px;font-weight:700;min-width:30px;text-align:right}
.chart{padding:8px 18px 16px}
.chart svg{width:100%;height:auto;display:block}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 18px;border-top:1px solid var(--line-2)}

/* live */
.lgrid{display:grid;grid-template-columns:300px minmax(0,1fr) 360px;gap:16px;align-items:stretch;min-height:560px}
.stage{border-radius:var(--r);background:radial-gradient(130% 90% at 50% 0%,#20343A,#0A1012);color:#9FB0BA;aspect-ratio:9/15;max-width:100%;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden}
.stage .tag{position:absolute;left:12px;top:12px;background:var(--live);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;letter-spacing:.06em}
.stage .vw{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;border-radius:8px;padding:2px 8px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini3>div{padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center}
.mini3 b{display:block;font-size:17px}
.feed{display:flex;flex-direction:column;min-height:0}
.feed .list{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:620px}
.cm{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid transparent}
.cm .av{width:30px;height:30px;border-radius:10px;font-size:12px}
.cm .who{font-weight:600;margin-right:6px}
.cm .res{font-size:12px;margin-top:2px}
.cm.hit{border-color:color-mix(in srgb,var(--s-sent) 30%,transparent);background:color-mix(in srgb,var(--s-sent) 8%,var(--surface))}.cm.hit .res{color:var(--s-sent)}
.cm.over{border-color:color-mix(in srgb,var(--red) 30%,transparent);background:color-mix(in srgb,var(--red) 7%,var(--surface))}.cm.over .res{color:var(--red)}
.cm.skip .res{color:var(--tx-3)}
.pinlist{display:flex;flex-direction:column;gap:8px;padding:12px}
.pin{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;background:var(--surface)}
.pin.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* chat */
.chat{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;height:calc(100vh - 210px);min-height:520px;overflow:hidden}
.chat>div{min-width:0;min-height:0;display:flex;flex-direction:column}
.clist{border-right:1px solid var(--line-2)}
.clist .items{overflow:auto;flex:1}
.ci{display:flex;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.ci:hover{background:var(--surface-2)}
.ci.on{background:var(--brand-soft)}
.ci .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .lm{color:var(--tx-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .un{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none}
.cv{background:var(--surface-2)}
.cvh{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line-2);background:var(--surface)}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.mg{max-width:70%;align-self:flex-start}
.mg.me{align-self:flex-end;text-align:right}
.mg .bb{display:inline-block;text-align:left;padding:10px 14px;border-radius:16px 16px 16px 6px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere}
.mg.me .bb{background:var(--brand);border-color:var(--brand);color:#fff;border-radius:16px 16px 6px 16px}
.mg .t{font-size:11px;color:var(--tx-3);margin-top:3px}
.slipcard{align-self:flex-start;max-width:360px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--s-pay)}
.comp{padding:10px 14px;border-top:1px solid var(--line-2);background:var(--surface)}
.comp .q{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.comp .q button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--tx-2)}
.cside{border-left:1px solid var(--line-2);overflow:auto}
.cside .sec{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}

/* settings hub */
.sgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.snav{padding:8px;position:sticky;top:0}
.snav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--tx-2);font-size:14px;text-align:left}
.snav button:hover{background:var(--surface-2)}
.snav button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
html.dark .snav button.on{color:var(--brand)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border-top:1px solid var(--line-2)}
.srow .t{font-weight:500}
.srow .d{color:var(--tx-3);font-size:13px;margin-top:2px}
.conn{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:16px 18px 18px}
.conn .c{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* drawer */
.el-drawer{border-radius:18px 0 0 18px}
.el-drawer__header{margin:0;padding:18px 22px;border-bottom:1px solid var(--line)}
.el-drawer__title{font-size:17px;font-weight:700;color:var(--tx)}
.el-drawer__body{padding:0;display:flex;flex-direction:column;background:var(--bg)}
.el-dialog{border-radius:18px}
.dbody{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.d2 .card+.card{margin-top:0}
.dcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.sec-h h4{margin:0;font-size:14px;font-weight:600}
.sec-b{padding:14px 16px}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:0}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--tx-2)}
.sum.big{font-size:16px;font-weight:700;color:var(--tx);padding-top:10px;margin-top:6px;border-top:1px solid var(--line-2)}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.flow{display:flex;gap:0;padding:16px}
.flow .st{flex:1;text-align:center;position:relative;font-size:12px;color:var(--tx-3)}
.flow .st::before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--line)}
.flow .st:first-child::before{display:none}
.flow .st .o{width:24px;height:24px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);position:relative;z-index:1;font-size:12px}
.flow .st.done{color:var(--tx)}.flow .st.done .o{background:var(--brand);border-color:var(--brand);color:#fff}.flow .st.done::before{background:var(--brand)}
.flow .st.cur .o{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}.flow .st.cur{color:var(--brand);font-weight:600}

/* report */
.bars{display:flex;align-items:flex-end;gap:12px;height:180px;padding:16px 18px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:38px;border-radius:8px;background:linear-gradient(180deg,#2CC4A7,#0E9F87)}
.bar span{font-size:11px;color:var(--tx-3)}
.share{padding:6px 18px 16px}
.share .r{display:flex;align-items:center;gap:10px;padding:8px 0}
.share .tr{flex:1;height:8px;border-radius:5px;background:var(--line-2);overflow:hidden}
.share .tr i{display:block;height:100%;border-radius:5px}

/* buyer */
.phone{width:min(380px,100%);margin:0 auto;border-radius:38px;border:10px solid #0F171B;overflow:hidden;background:var(--bg);box-shadow:var(--sh-2)}
.phone .top{padding:20px 18px 26px;background:linear-gradient(150deg,#14B79A,#0A6E5E);color:#fff}
.phone .body{padding:0 12px 12px;margin-top:-14px;display:flex;flex-direction:column;gap:10px}
.phone .card{border-radius:16px}
.phone .card+.card{margin-top:0}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;margin-top:8px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.phone .ft{padding:12px;background:var(--surface);border-top:1px solid var(--line)}

/* cmdk */
.kd .el-dialog__header{display:none}.kd .el-dialog__body{padding:0}
.kin{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.kin input{flex:1;border:0;outline:0;background:none;font:15px var(--font);color:var(--tx)}
.kl{max-height:380px;overflow:auto;padding:8px}
.kg{font-size:11px;color:var(--tx-3);padding:8px 10px 4px}
.kit{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.kit.on{background:var(--brand-soft);color:var(--brand-ink)}
html.dark .kit.on{color:var(--brand)}
.kit .s{margin-left:auto;font-size:12px;color:var(--tx-3)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pgrid button{height:76px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:700;cursor:pointer}
.pgrid button:hover{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

@media (max-width:1200px){.lgrid{grid-template-columns:minmax(0,1fr) 340px}.lgrid .stagecol{display:none}.chat{grid-template-columns:280px minmax(0,1fr)}.cside{display:none!important}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:767px){
  .rail{display:none}.view{padding:16px}.search{flex:1;width:auto;max-width:none}.search span,.search kbd,.me .nm{display:none}
  .ph h1{font-size:20px}.ph .acts{margin-left:0}
  .lgrid{grid-template-columns:minmax(0,1fr)}.chat{grid-template-columns:minmax(0,1fr);height:auto}.chat.open .clist{display:none}.chat:not(.open) .cv{display:none}
  .sgrid,.d2{grid-template-columns:minmax(0,1fr)}.snav{position:static;display:flex;overflow-x:auto}.snav button{white-space:nowrap;width:auto}
  .kpis{grid-template-columns:minmax(0,1fr)}.fsearch{max-width:none}
}

/* completeness additions */
.adv{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px 20px;padding:4px 16px 14px;border-bottom:1px solid var(--line-2)}
.advg{display:flex;flex-direction:column;gap:6px}.advg .al{font-size:12px;color:var(--tx-3)}
.tbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.el-table.dense td.el-table__cell{padding:6px 0}
.xp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:6px 20px 14px 90px;background:var(--surface-2)}
.xpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.xph{font-size:12px;color:var(--tx-3);margin-bottom:6px}
.xl{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}.xl:last-child{border-bottom:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.fgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.up{width:72px;height:72px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600}
.up.add{background:var(--surface-2);border:1px dashed var(--el-border-color);color:var(--tx-3);cursor:pointer}
.drop{width:100%;border:1px dashed var(--el-border-color);border-radius:12px;padding:20px;text-align:center;color:var(--tx-3);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.kw{padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.rk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:4px 16px 16px}
.rkc{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.rkc .k{font-size:12px;color:var(--tx-3)}.rkc .v{font-size:20px;font-weight:700}.rkc .d{font-size:12px;font-weight:600}
@media (max-width:767px){.fgrid,.fgrid3,.xp{grid-template-columns:minmax(0,1fr)}.xp{padding:8px}.adv{grid-template-columns:minmax(0,1fr)}}

.lsrc{display:flex;align-items:center;gap:16px;padding:14px 16px;flex-wrap:wrap}
.lvids{display:flex;gap:8px;flex:1 1 480px;min-width:0;overflow-x:auto}
.lvid{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;min-width:200px;text-align:left;color:var(--tx)}
.lvid.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--s-sent);box-shadow:0 0 0 4px color-mix(in srgb,var(--s-sent) 20%,transparent)}.dotlive.off{background:var(--tx-3);box-shadow:none}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 18px 18px}
.mode{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.rates{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.rate{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;color:var(--tx)}
.rate.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
@media (max-width:767px){.modes{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.rte{display:flex;flex-wrap:wrap;gap:2px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:4px;background:var(--bg)}
.rte button{border:0;background:none;padding:4px 8px;border-radius:6px;font:inherit;font-size:12px;color:var(--tx-2);cursor:pointer}.rte button:hover{background:var(--surface)}
.rte+.el-textarea .el-textarea__inner{border-top-left-radius:0;border-top-right-radius:0}
.fxbox{min-height:40px;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:13px;background:var(--bg)}
.picg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-height:360px;overflow:auto}
.pic{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.pic span{display:block;aspect-ratio:1;border-radius:8px}.pic i{font-style:normal}.pic.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-weak,rgba(14,159,135,.2))}
.note{background:color-mix(in srgb,var(--s-pay) 10%,transparent);color:var(--tx-2);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
/* ===== โทนมืออาชีพ: สีเน้นสีเดียว สถานะเป็นจุดเล็ก พื้นหลังเรียบ ===== */
:root{
  --brand:#0F766E; --brand-ink:#0B5D57; --brand-soft:#EEF4F3; --brand-soft-2:#D5E5E2; --live:#D9363E;
  --bg:#F5F6F7; --surface:#FFFFFF; --surface-2:#F7F8F9; --line:#E3E6E9; --line-2:#EEF0F2;
  --tx:#1F2933; --tx-2:#4B5563; --tx-3:#8A939C;
  --rail:#FFFFFF; --rail-2:#F1F3F5; --rail-tx:#4B5563; --rail-hi:#1F2933;
  --red:#C2383F; --warn:#B7791F;
  --s-pay:#B7791F; --s-ship:#3B6EA8; --s-print:#6B5B95; --s-pickup:#3B7E8C; --s-sent:#2F7D4F; --s-cancel:#9AA3AB;
  --sh-1:none; --sh-2:0 8px 24px rgba(17,24,39,.12);
  --r:8px; --r-s:6px;
  --el-color-primary:#0F766E; --el-color-primary-light-3:#57A09A; --el-color-primary-light-5:#87BBB6; --el-color-primary-light-7:#B7D6D3; --el-color-primary-light-8:#CFE3E1; --el-color-primary-light-9:#EEF4F3; --el-color-primary-dark-2:#0B5D57;
  --el-border-radius-base:6px; --el-border-radius-small:4px; --el-border-color:#D6DADF;
}
html.dark{
  --brand:#3FA89E; --brand-ink:#6CC1B8; --brand-soft:rgba(63,168,158,.12); --brand-soft-2:rgba(63,168,158,.24); --live:#E5575E;
  --bg:#111417; --surface:#171B1F; --surface-2:#1C2126; --line:#2A3036; --line-2:#22282D;
  --tx:#E4E7EA; --tx-2:#AEB5BC; --tx-3:#7B848C;
  --rail:#171B1F; --rail-2:#22282D; --rail-tx:#AEB5BC; --rail-hi:#E4E7EA;
  --s-pay:#D69E2E; --s-ship:#6E9BD1; --s-print:#9D8EC4; --s-pickup:#6FB0BD; --s-sent:#5FAE7E; --s-cancel:#7B848C;
  --el-color-primary:#3FA89E; --el-color-primary-dark-2:#6CC1B8; --el-color-primary-light-9:#18302D; --el-color-primary-light-8:#1C3A36; --el-color-primary-light-7:#21453F;
}
/* แถบเมนูสว่าง */
.rail{border-right:1px solid var(--line)}
.brandbox b{color:var(--tx)}
.mark{background:var(--brand);border-radius:8px}.mark::after{display:none}
.shopsel{color:var(--tx);border:1px solid var(--line);background:var(--surface-2);border-radius:8px}.shopsel small{color:var(--tx-3)}
.nb{border-radius:6px;height:38px}
.nb:hover{background:var(--rail-2);color:var(--tx)}
.nb.on{background:var(--brand-soft);color:var(--brand-ink);box-shadow:none;font-weight:600}
html.dark .nb.on{color:var(--brand)}
.nb.on .el-icon{color:var(--brand)}
.nb .cnt{background:var(--rail-2);color:var(--tx-2);border:1px solid var(--line)}
.nb .live{background:none;color:var(--live);border:1px solid currentColor;line-height:14px}
.ngap{background:var(--line-2)}
/* ส่วนหัวและการ์ด */
.topbar{height:56px}
.search,.ib,.me{border-radius:6px}
.ph h1{font-size:20px;font-weight:600}
.card{box-shadow:none}
.stab.on i{background:var(--surface-2);color:var(--brand);border-color:var(--brand-soft-2)}
.chip{border-style:solid;border-radius:6px;height:32px}
.chip.set{background:var(--surface);border-color:var(--brand);color:var(--brand-ink);font-weight:500}
html.dark .chip.set{color:var(--brand)}
/* ป้ายสถานะ: จุดสี + ตัวอักษรเทา ไม่มีพื้นสี */
.badge{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;font-weight:500;height:22px;padding:0 8px}
.badge:not(.dot){color:var(--tx-2)!important}
.badge.dot{background:none;border:0;padding:0;font-weight:500}
/* รูปย่อสินค้า ไอคอนช่องทาง อวตาร: เรียบ ไม่ใช้สีจัด */
.th{background:var(--surface-2)!important;color:var(--tx-2)!important;border:1px solid var(--line);border-radius:6px}
.ch-ico{background:var(--surface-2)!important;color:var(--tx-2)!important;border:1px solid var(--line);border-radius:4px}
.av{background:var(--surface-2);color:var(--tx-2);border:1px solid var(--line);border-radius:50%}
html.dark .av{color:var(--tx-2)}
.empty .ill{background:var(--surface-2);color:var(--tx-3);border-radius:12px}
/* ไลฟ์ */
.cm{background:var(--surface);border:1px solid var(--line-2);border-left:2px solid var(--line);border-radius:6px}
.cm.hit{background:var(--surface);border-color:var(--line-2);border-left-color:var(--s-sent)}
.cm.over{background:var(--surface);border-color:var(--line-2);border-left-color:var(--red)}
.stage{background:#1F2428;border-radius:8px}
.stage .tag{border-radius:4px}
.pin,.lvid,.rate,.mode{border-radius:6px}
.pin.on,.lvid.on,.rate.on{box-shadow:none;border-color:var(--brand)}
.mode{background:var(--surface)}
/* กราฟ */
.bar i{background:var(--brand);border-radius:3px 3px 0 0;opacity:.85}
.share .tr i{background:var(--brand)!important;opacity:.75}
.kpi .v{font-size:24px;font-weight:600}
.el-dialog,.el-drawer,.el-message-box{--el-dialog-border-radius:8px;border-radius:8px}
.el-tag{border-radius:4px}

      </div></div>
      <div class="lgrid">
        <div class="stagecol"><div class="stage"><span class="tag">● LIVE</span><span class="vw">👁 214</span><div><el-icon :size="34"><VideoCamera/></el-icon><div style="margin-top:6px">ภาพสดจากเพจของคุณ</div></div></div>
          <div class="mini3"><div><b class="num">{{liveOrders.length}}</b><span class="f12 c3">ออเดอร์</span></div><div><b class="num">{{baht(liveSum)}}</b><span class="f12 c3">ยอดขาย</span></div><div><b class="num">{{feed.filter(c=>c.sent).length}}</b><span class="f12 c3">ส่งลิงก์แล้ว</span></div></div></div>

          <div class="list"><div v-for="c in feedList" :key="c.n" class="cm" :class="c.cls"><span class="av">{{c.who[0]}}</span><div class="grow"><div class="row" style="gap:6px"><span class="who">{{c.who}}</span><span class="f12 c3">{{c.t}}</span><span class="grow"></span><el-dropdown trigger="click" @command="x=>note(x+' · '+c.who)"><el-button size="small" text :icon="'MoreFilled'" aria-label="จัดการคอมเมนต์"/><template #dropdown><el-dropdown-menu><el-dropdown-item command="สร้างออเดอร์จากคอมเมนต์นี้แล้ว">สร้างออเดอร์เอง</el-dropdown-item><el-dropdown-item command="ตอบใต้คอมเมนต์แล้ว">ตอบใต้คอมเมนต์</el-dropdown-item><el-dropdown-item command="ส่งข้อความส่วนตัวแล้ว">ส่งข้อความส่วนตัว</el-dropdown-item><el-dropdown-item command="ซ่อนคอมเมนต์แล้ว">ซ่อนคอมเมนต์</el-dropdown-item><el-dropdown-item command="ไม่รับออเดอร์จากคนนี้แล้ว" divided>ไม่รับออเดอร์จากคนนี้</el-dropdown-item></el-dropdown-menu></template></el-dropdown></div>{{c.text}}<div class="res" v-if="c.res">{{c.res}} <button class="lk f12" v-if="c.cls==='over'" @click="note('เก็บเป็นรายการรอของแล้ว')">เก็บเป็นรายการรอของ</button></div><div class="f12" v-if="c.sent" style="color:var(--brand);margin-top:2px"><el-icon style="vertical-align:-2px"><Promotion/></el-icon> {{c.sent}}</div></div></div>

        <div class="card" style="display:flex;flex-direction:column;min-height:0"><el-tabs v-model="liveTab" style="padding:0 16px"><el-tab-pane label="สินค้าบนไลฟ์" name="p"/><el-tab-pane :label="'ออเดอร์รอบนี้ · '+liveOrders.length" name="o"/></el-tabs>

      </div>
    </template>

    <!-- ===== ออเดอร์ ===== -->
    <template v-if="view==='orders'">
      <div class="ph"><div><h1>ออเดอร์</h1><p>ทุกช่องทางในที่เดียว เรียงตามสิ่งที่ต้องทำต่อ</p></div><div class="acts">
        <el-dropdown trigger="click" @command="c=>note(c)"><el-button :icon="'Refresh'">ดึงออเดอร์<el-icon class="el-icon--right"><ArrowDown/></el-icon></el-button><template #dropdown><el-dropdown-menu><el-dropdown-item command="ดึงออเดอร์ใหม่จากทุกร้านแล้ว">ดึงออเดอร์ใหม่จากทุกร้าน</el-dropdown-item><el-dropdown-item command="ดึงข้อมูลล่าสุดของออเดอร์ที่เลือกแล้ว">ดึงข้อมูลล่าสุดเฉพาะที่เลือก</el-dropdown-item><el-dropdown-item command="ซิงก์ตามเงื่อนไขที่กรองแล้ว">ซิงก์ตามเงื่อนไขที่กรองอยู่</el-dropdown-item></el-dropdown-menu></template></el-dropdown>
        <el-button :icon="'Download'" @click="note('กำลังเตรียมไฟล์ส่งออก')">ส่งออก</el-button><el-button type="primary" :icon="'Plus'" @click="newOrder">ออเดอร์ใหม่</el-button></div></div>
      <div class="card">
        <div class="stabs"><button v-for="t in tabs" :key="t" class="stab" :class="{on:of.tab===t}" @click="of.tab=t;clearSel()">{{t==='all'?'ทั้งหมด':t==='issue'?'มีปัญหา':ST[t]}}<i v-if="!['sent','cancel'].includes(t)">{{t==='all'?orders.length:t==='issue'?orders.filter(o=>o.issue).length:cnt(t)}}</i></button></div>
